<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatanZero — צפייה במשחק</title>
<style>
:root{color-scheme:dark;--bg:#09141e;--panel:#12222e;--muted:#93a8b5;--line:#263c49;--gold:#f1c985}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 55% 15%,#193442,var(--bg) 70%);font:15px 'Segoe UI',Arial,sans-serif;color:#edf3f3}button,select,input{font:inherit}button,select{background:#1b303e;border:1px solid #3b5261;color:#eef3f2;border-radius:9px;padding:10px 17px;cursor:pointer}button:hover{background:#2d4858}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.35;cursor:default}header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px;letter-spacing:.2px}header p{color:var(--muted);margin:6px 0 0}.brand{direction:ltr;font-size:23px;font-weight:700;letter-spacing:1px}.brand span{color:var(--gold)}.pill{font-size:12px;color:var(--gold);padding:7px 13px;border:1px solid #65573b;border-radius:30px}.layout{max-width:1500px;margin:auto;padding:22px 28px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;direction:ltr}.board-panel,.sidebar{direction:rtl}.board-panel{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0c202c;box-shadow:0 18px 65px #0003}.board-top{display:flex;justify-content:space-between;gap:10px;padding:17px 22px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}#status{color:#fff;font-weight:600}svg{width:100%;height:min(62vh,650px);display:block;background:radial-gradient(ellipse,#204a5a,#0c202c 72%)}.controls{padding:18px 22px;background:#112530;border-top:1px solid var(--line)}.timeline{display:flex;align-items:center;gap:14px;margin-bottom:15px;direction:ltr}input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}#progress{min-width:104px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}.buttons{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.primary{background:var(--gold);color:#172430;border:0;font-weight:700;min-width:104px}.primary:hover{background:#ffdea3}.speed{margin-right:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.sidebar h2{font-size:13px;letter-spacing:1px;color:var(--muted);margin:0 0 12px}.player{background:var(--panel);border:1px solid var(--line);border-right:4px solid var(--player);padding:15px 17px;border-radius:12px;margin-bottom:10px}.player.active{box-shadow:0 0 0 1px var(--player)}.player-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.player-name{font-size:17px;font-weight:600}.score{font-size:23px;font-weight:700;color:var(--player)}.score small{font-size:11px;color:var(--muted);font-weight:400}.resources{display:flex;justify-content:space-between;gap:5px}.resource{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px}.resource b{font-size:15px;color:#e9f0f1}.resource i{display:block;width:17px;height:17px;border-radius:4px}.badges{font-size:11px;color:var(--gold);min-height:14px;margin-top:9px}.event{background:#192d3a;border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:17px}.event-title{font-size:12px;color:var(--muted);margin-bottom:8px}#event{line-height:1.65;min-height:48px}#dice{display:flex;gap:7px;margin-top:12px;direction:ltr}.die{border:1px solid #cfbea2;background:#eee5d6;color:#132530;font-size:22px;border-radius:7px;width:37px;height:37px;display:grid;place-items:center}.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:16px}.hex{stroke:#102c36;stroke-width:3}.tile-label{fill:#193123;font-size:11px;font-weight:700;text-anchor:middle}.number{fill:#25303a;font-weight:700;font-size:22px;text-anchor:middle}.hot{fill:#b94030}.port-text{fill:#bacdd5;font-size:13px;text-anchor:middle}.building{stroke:#102332;stroke-width:2.5}.port-circle{fill:#173745;stroke:#59747f;stroke-width:1}.legend{display:flex;gap:15px;justify-content:center;color:var(--muted);font-size:12px;padding:0 15px 13px}.legend span::before{content:'•';color:var(--gold);margin-left:5px}#winner{color:var(--gold)}@media(max-width:950px){.layout{grid-template-columns:1fr;padding:14px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sidebar h2,.event,.note{grid-column:1/-1}.player{margin:0}header{padding:18px}svg{height:55vh}.speed{margin-right:0}}@media(max-width:500px){.sidebar{grid-template-columns:1fr}.buttons button{padding:9px 12px}.brand{font-size:18px}.pill{display:none}h1{font-size:20px}.board-top{padding:13px}.controls{padding:13px}svg{height:46vh}}
</style>
</head>
<body>
<header><div><h1>צפייה במשחק קאטן</h1><p>משחק מוקלט · <span id="player-count"></span> שחקנים אקראיים · <span id="seed"></span></p></div><div class="brand">CATAN<span>ZERO</span></div><span class="pill">שידור חוזר</span></header>
<main class="layout">
<section class="board-panel" aria-label="לוח המשחק">
<div class="board-top"><span id="status"></span><span id="winner"></span><span id="turn"></span></div>
<svg id="board" viewBox="-450 -365 900 730" role="img" aria-label="לוח קאטן: משאבים, כבישים, יישובים ושודד"><defs><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".3"/></filter></defs><g id="tiles"></g><g id="roads"></g><g id="buildings"></g><g id="robber"></g></svg>
<div class="legend"><span>בית = יישוב</span><span>בית כפול = עיר</span><span>דמות כהה = שודד</span></div>
<div class="controls"><div class="timeline"><span id="progress"></span><input id="scrubber" type="range" min="0" value="0" aria-label="מהלך במשחק"></div><div class="buttons"><button id="play" class="primary">▶ ניגון</button><button id="previous" aria-label="המהלך הקודם">הקודם</button><button id="next" aria-label="המהלך הבא">הבא</button><button id="start">להתחלה</button><button id="end">לסיום</button><label class="speed">מהירות<select id="speed" aria-label="מהירות ניגון"><option value="1000">איטי</option><option value="300" selected>רגיל</option><option value="80">מהיר</option><option value="20">מהיר מאוד</option></select></label></div></div>
</section>
<aside class="sidebar"><h2>השחקנים</h2><div id="players" style="display:contents"></div><div class="event"><div class="event-title">המהלך האחרון</div><div id="event"></div><div id="dice" aria-label="תוצאת הקוביות האחרונה"></div></div><p class="note">תצוגת צופה: המשאבים והניקוד המלא של כל השחקנים גלויים. אפשר לעצור ולגרור את ציר הזמן, או להשתמש במקשי החצים וברווח.</p></aside>
</main>
<script type="application/json" id="replay-data">__REPLAY_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('replay-data').textContent);
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const colors={RED:'#f27765',BLUE:'#6db8ef',WHITE:'#f0ebdf',ORANGE:'#f0b35c'};
const names={RED:'אדום',BLUE:'כחול',WHITE:'לבן',ORANGE:'כתום'};
const resources={WOOD:['עץ','#61996a'],BRICK:['לבנים','#bd7960'],SHEEP:['צמר','#a6c980'],WHEAT:['חיטה','#dfc373'],ORE:['עפרות','#8fa2b2'],DESERT:['מדבר','#d5b991']};
const labels={BUILD_SETTLEMENT:'בנה יישוב',BUILD_ROAD:'בנה כביש',BUILD_CITY:'שדרג לעיר',END_TURN:'סיים את התור',ROLL:'הטיל קוביות',MOVE_ROBBER:'הזיז את השודד',DISCARD_RESOURCE:'השליך משאב',BUY_DEVELOPMENT_CARD:'קנה קלף פיתוח',PLAY_KNIGHT_CARD:'שיחק קלף אביר',PLAY_YEAR_OF_PLENTY:'שיחק שנת שפע',PLAY_MONOPOLY:'שיחק מונופול',PLAY_ROAD_BUILDING:'שיחק סלילת דרכים',MARITIME_TRADE:'סחר עם הבנק או נמל',OFFER_TRADE:'הציע מסחר',ACCEPT_TRADE:'קיבל הצעת מסחר',REJECT_TRADE:'דחה הצעת מסחר',CONFIRM_TRADE:'אישר מסחר',CANCEL_TRADE:'ביטל מסחר'};
function svg(tag,attrs={},parent){const el=document.createElementNS(NS,tag);for(const [key,value]of Object.entries(attrs))el.setAttribute(key,value);if(parent)parent.appendChild(el);return el;}
function text(parent,x,y,value,cls){const el=svg('text',{x,y,class:cls},parent);el.textContent=value;return el;}
function hex(x,y){return Array.from({length:6},(_,i)=>{const a=(-90+60*i)*Math.PI/180;return `${x+64*Math.cos(a)},${y+64*Math.sin(a)}`}).join(' ');}
for(const tile of data.tiles){if(tile.kind==='port'){svg('circle',{cx:tile.x,cy:tile.y,r:26,class:'port-circle'},$('tiles'));text($('tiles'),tile.x,tile.y-2,tile.resource?'2:1':'3:1','port-text');text($('tiles'),tile.x,tile.y+16,tile.resource?resources[tile.resource][0]:'נמל','port-text');continue;}const resource=resources[tile.resource||'DESERT'];svg('polygon',{points:hex(tile.x,tile.y),fill:resource[1],class:'hex'},$('tiles'));
// Simple resource emblems keep the tiles recognizable at small sizes.
const g=svg('g',{transform:`translate(${tile.x},${tile.y-31})`,opacity:'.45'},$('tiles'));
if(tile.resource==='WOOD'){for(const dx of [-15,0,15])svg('path',{d:`M${dx} -15 l-10 20 h20 z`,fill:'#21472f'},g);}
else if(tile.resource==='ORE')svg('path',{d:'M-23 10 L-7 -16 L3 0 L13 -12 L27 10 Z',fill:'#334e60'},g);
else if(tile.resource==='WHEAT'){for(const dx of [-13,0,13]){svg('path',{d:`M${dx} 12 v-24 m0 6 l-6 -5 m6 10 l6 -5`,stroke:'#7a602b','stroke-width':3,fill:'none'},g);}}
else if(tile.resource==='BRICK'){for(const [x,y]of [[-19,-7],[1,-7],[-9,5]])svg('rect',{x,y,width:17,height:9,rx:1,fill:'#754332'},g);}
else if(tile.resource==='SHEEP'){svg('ellipse',{cx:0,cy:0,rx:19,ry:11,fill:'#f4f7e4'},g);svg('circle',{cx:17,cy:0,r:6,fill:'#3b5234'},g);}
text($('tiles'),tile.x,tile.y+44,resource[0],'tile-label');if(tile.number){svg('circle',{cx:tile.x,cy:tile.y+7,r:21,fill:'#f3e7cd',stroke:'#ffffff45'},$('tiles'));text($('tiles'),tile.x,tile.y+15,tile.number,`number ${[6,8].includes(tile.number)?'hot':''}`);}}
let index=0,timer=null;
$('seed').textContent=`seed ${data.seed}`;$('player-count').textContent=data.frames[0].players.length;$('scrubber').max=data.frames.length-1;
function describe(frame){if(!frame.action)return 'הלוח מוכן. השחקנים מתחילים להציב יישובים וכבישים.';const [[color,type,value],result]=frame.action;let message=`${names[color]} ${labels[type]||type}`;if(type==='ROLL'&&result)message+=` — ${result.join(' + ')} = ${result.reduce((a,b)=>a+b,0)}`;if(type==='DISCARD_RESOURCE'&&resources[value])message+=` (${resources[value][0]})`;return message;}
function render(){const frame=data.frames[index];$('roads').replaceChildren();$('buildings').replaceChildren();$('robber').replaceChildren();for(const [edge,color]of frame.roads){const a=data.nodes[edge[0]],b=data.nodes[edge[1]];svg('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#102332','stroke-width':11,'stroke-linecap':'round'},$('roads'));svg('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:colors[color],'stroke-width':6,'stroke-linecap':'round'},$('roads'));}for(const [node,color,kind]of frame.buildings){const p=data.nodes[node];const g=svg('g',{transform:`translate(${p[0]},${p[1]})`,filter:'url(#shadow)'},$('buildings'));svg('path',{d:kind==='CITY'?'M-14 11 V-2 L-7 -10 L0 -2 V-13 L8 -21 L17 -13 V11 Z':'M-11 10 V-3 L0 -14 L11 -3 V10 Z',fill:colors[color],class:'building'},g);}
const robbed=data.tiles.find(tile=>JSON.stringify(tile.coordinate)===JSON.stringify(frame.robber));if(robbed){const g=svg('g',{transform:`translate(${robbed.x+32},${robbed.y-3})`},$('robber'));svg('circle',{cx:0,cy:-13,r:7,fill:'#162432',stroke:'#aebfbd','stroke-width':1.5},g);svg('path',{d:'M-6 -5 Q-10 5 -11 16 Q0 22 11 16 Q10 5 6 -5 Z',fill:'#162432',stroke:'#aebfbd','stroke-width':1.5},g);}
$('players').replaceChildren();for(const player of frame.players){const el=document.createElement('div');el.className=`player ${frame.current===player.color&&!frame.winner?'active':''}`;el.style.setProperty('--player',colors[player.color]);const resourceHTML=Object.keys(resources).slice(0,5).map((key,i)=>`<span class="resource"><i style="background:${resources[key][1]}"></i><b>${player.resources[i]}</b>${resources[key][0]}</span>`).join('');el.innerHTML=`<div class="player-head"><span class="player-name">${names[player.color]}${frame.winner===player.color?' · מנצח':''}</span><span class="score">${player.vp} <small>נקודות</small></span></div><div class="resources">${resourceHTML}</div><div class="badges">${[player.road?'הדרך הארוכה ביותר':'',player.army?'הצבא הגדול ביותר':'',player.knights?`${player.knights} אבירים שוחקו`:''].filter(Boolean).join(' · ')}</div>`;$('players').appendChild(el);}
$('status').textContent=frame.winner?'המשחק הסתיים':index<data.frames[0].players.length*4?'שלב ההקמה':`בתור: ${names[frame.current]}`;$('winner').textContent=frame.winner?`${names[frame.winner]} ניצח` : '';$('turn').textContent=`תורות שהסתיימו: ${frame.turn}`;$('event').textContent=describe(frame);$('progress').textContent=`${index} / ${data.frames.length-1}`;$('scrubber').value=index;$('previous').disabled=index===0;$('next').disabled=index===data.frames.length-1;$('dice').replaceChildren();if(frame.dice)for(const value of frame.dice){const el=document.createElement('span');el.className='die';el.textContent=value;$('dice').appendChild(el);}}
function pause(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='▶ ניגון';}
function seek(value){pause();index=Math.max(0,Math.min(data.frames.length-1,value));render();}
function play(){if(timer!==null){pause();return;}if(index===data.frames.length-1)index=0;$('play').textContent='❚❚ עצירה';render();timer=setInterval(()=>{index++;render();if(index===data.frames.length-1)pause();},Number($('speed').value));}
$('play').onclick=play;$('next').onclick=()=>seek(index+1);$('previous').onclick=()=>seek(index-1);$('start').onclick=()=>seek(0);$('end').onclick=()=>seek(data.frames.length-1);$('scrubber').oninput=event=>seek(Number(event.target.value));$('speed').onchange=()=>{if(timer!==null){pause();play();}};
document.addEventListener('keydown',event=>{if(['INPUT','SELECT','BUTTON'].includes(event.target.tagName))return;if(event.code==='Space'){event.preventDefault();play();}if(event.code==='ArrowRight'){event.preventDefault();seek(index+1);}if(event.code==='ArrowLeft'){event.preventDefault();seek(index-1);}});render();
</script></body></html>
